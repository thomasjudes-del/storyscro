<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071d2a">
  <title>StoryScro Generic Renderer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="refine.css">
</head>
<body>
  <div class="reading-progress" aria-hidden="true"><span id="readingProgress"></span></div>
  <header class="story-header" id="storyHeader">
    <a class="brand" href="#story-top" aria-label="StoryScro"><span class="brand-mark"></span><span>StoryScro</span></a>
    <nav class="chapter-nav" id="chapterNav" aria-label="Chapitres"></nav>
    <button class="source-trigger" id="allSourcesBtn" type="button">Sources</button>
  </header>

  <aside class="micro-nav" id="microNav" aria-label="Navigation dans le récit">
    <div class="micro-track" id="microTrack"></div>
    <div class="micro-controls">
      <button id="prevScene" type="button" aria-label="Scène précédente">↑</button>
      <button id="nextScene" type="button" aria-label="Scène suivante">↓</button>
    </div>
  </aside>

  <main id="story-top" tabindex="-1">
    <div class="loading" id="loading"><span></span><p>Construction du récit…</p></div>
    <div id="storyRoot"></div>
  </main>

  <aside class="source-drawer" id="sourceDrawer" aria-hidden="true">
    <button class="drawer-close" id="sourceClose" type="button">Fermer</button>
    <p class="drawer-kicker">Provenance</p>
    <h2 id="sourceTitle">Sources</h2>
    <div id="sourceBody"></div>
  </aside>

  <script src="app.js"></script>
  <script src="refine.js"></script>
</body>
</html>
