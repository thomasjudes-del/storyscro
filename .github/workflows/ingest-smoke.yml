name: Smoke PDF Ingestion

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: storyscro-ingest-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ingestion dependencies
        run: python -m pip install --disable-pip-version-check -r engine/requirements.txt

      - name: Syntax check
        run: python -m py_compile engine/ingest.py scripts/test_ingest.py

      - name: Run synthetic PDF ingestion regression
        run: python scripts/test_ingest.py
